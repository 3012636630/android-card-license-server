name: Build RMX8899 touch slot restore

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TARGET_RELEASE: 6.12.38-android16-5-g8c67d4274c0a-ab14275539-4k
      TARGET_VERMAGIC: 6.12.38-android16-5-g8c67d4274c0a-ab14275539-4k SMP preempt mod_unload modversions aarch64
      SOURCE_ARCHIVE: artifacts/lsdriver-rmx8899-slot-restore-src.tar.gz
      DONOR_MODULE: artifacts/lsdriver-rmx8899-abi9-timestamp-reset-crcfix.ko

    steps:
      - name: Checkout build inputs
        uses: actions/checkout@v4

      - name: Install kernel build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libdw-dev libelf-dev libssl-dev dwarves lld llvm
          clang --version | head -n 2
          ld.lld --version | head -n 1
          llvm-ar --version | head -n 1

      - name: Fetch official RMX8899 AndroidB common source
        run: |
          set -euo pipefail
          git clone --depth 1 --single-branch --branch master \
            https://github.com/realme-kernel-opensource/realme_neo8-AndroidB-common-source.git \
            "$RUNNER_TEMP/kernel"
          grep -q '^VERSION = 6$' "$RUNNER_TEMP/kernel/Makefile"
          grep -q '^PATCHLEVEL = 12$' "$RUNNER_TEMP/kernel/Makefile"
          grep -q '^SUBLEVEL = 38$' "$RUNNER_TEMP/kernel/Makefile"

      - name: Prepare exact target Kbuild
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/kernel"
          OUT="$RUNNER_TEMP/kout"
          MAKE_ARGS=(ARCH=arm64 LLVM=1 LLVM_IAS=1)
          make -C "$SRC" O="$OUT" "${MAKE_ARGS[@]}" gki_defconfig
          "$SRC/scripts/config" --file "$OUT/.config" \
            --set-str LOCALVERSION "-${TARGET_RELEASE#6.12.38-}"
          "$SRC/scripts/config" --file "$OUT/.config" --disable LOCALVERSION_AUTO
          make -C "$SRC" O="$OUT" "${MAKE_ARGS[@]}" olddefconfig
          grep -q '^CONFIG_MODULES=y' "$OUT/.config"
          grep -q '^CONFIG_MODVERSIONS=y' "$OUT/.config"
          make -C "$SRC" O="$OUT" "${MAKE_ARGS[@]}" -j2 modules_prepare
          actual=$(tr -d '\r\n' < "$OUT/include/config/kernel.release")
          printf 'actual kernel release: %s\n' "$actual"
          test "$actual" = "$TARGET_RELEASE"
          printf '%s\n' "$actual" | tee "$RUNNER_TEMP/kernel.release"

      - name: Build slot restore module with device CRCs
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/kernel"
          OUT="$RUNNER_TEMP/kout"
          WORK="$RUNNER_TEMP/lsdriver"
          mkdir -p "$WORK"
          tar -xzf "$SOURCE_ARCHIVE" --strip-components=1 -C "$WORK"
          test -f "$WORK/touch_inject.c"
          grep -q 'Synthetic frames bypass input_mt' "$WORK/touch_inject.c"
          grep -q 'INJECTED_LOGICAL_SLOTS \* 2 + 4' "$WORK/touch_inject.c"
          grep -q 'clamp(ptm.current_slot, 0,' "$WORK/touch_inject.c"
          ! find "$WORK" -type f \( -name '*.o' -o -name '*.ko' \) | grep -q .

          python3 artifacts/patch_rmx8899_module.py emit-symvers "$DONOR_MODULE" \
            > "$OUT/Module.symvers"
          grep -q $'0xe976b219\tmodule_layout\t' "$OUT/Module.symvers"

          make -C "$SRC" O="$OUT" M="$WORK" ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            KCFLAGS='-fsanitize-cfi-icall-experimental-normalize-integers -Wno-error=unused-command-line-argument' \
            KBUILD_MODPOST_WARN=1 -j2 modules
          test -f "$WORK/lsdriver.ko"

      - name: Patch and verify RMX8899 module
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/lsdriver"
          ARTIFACT="$RUNNER_TEMP/artifact"
          mkdir -p "$ARTIFACT"
          python3 artifacts/patch_rmx8899_module.py patch \
            "$WORK/lsdriver.ko" "$DONOR_MODULE" \
            "$ARTIFACT/lsdriver-rmx8899-slot-restore-crcfix.ko" \
            "$ARTIFACT/patch-report.txt"
          module="$ARTIFACT/lsdriver-rmx8899-slot-restore-crcfix.ko"
          actual=$(modinfo -F vermagic "$module")
          test "$actual" = "$TARGET_VERMAGIC"
          file "$module" | grep -q 'ELF 64-bit LSB relocatable, ARM aarch64'
          readelf -h "$module" > "$ARTIFACT/elf-header.txt"
          readelf -Ws "$module" | grep -E 'v_touch_event|v_touch_get_physical_state' \
            > "$ARTIFACT/touch-symbols.txt"
          printf '%s\n' "$actual" > "$ARTIFACT/vermagic.txt"
          sha256sum "$module" > "$ARTIFACT/SHA256SUMS.txt"
          cp "$RUNNER_TEMP/kernel.release" "$ARTIFACT/kernel.release"
          cat "$ARTIFACT/patch-report.txt"
          cat "$ARTIFACT/SHA256SUMS.txt"

      - name: Upload RMX8899 module
        uses: actions/upload-artifact@v4
        with:
          name: lsdriver-rmx8899-slot-restore
          path: ${{ runner.temp }}/artifact
          if-no-files-found: error
